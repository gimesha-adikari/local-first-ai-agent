[package]
name = "inference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
llama = ["dep:llama-cpp-2", "dep:minijinja", "dep:minijinja-contrib", "dep:sha2", "dep:libc"]

[dependencies]
agent-core = { path = "../agent-core" }
futures-channel = "0.3.34"
serde.workspace = true
llama-cpp-2 = { version = "=0.1.161", default-features = false, optional = true }
minijinja = { version = "2", features = ["builtins", "json", "fuel"], optional = true }
minijinja-contrib = { version = "2", features = ["pycompat"], optional = true }

sha2 = { version = "=0.10.9", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "=0.2.191", optional = true }

[dev-dependencies]
futures-executor = "0.3.34"
