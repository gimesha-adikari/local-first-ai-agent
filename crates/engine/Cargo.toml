[package]
name = "engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
agent-core = { path = "../agent-core" }
futures-channel = { version = "0.3.34", features = ["sink"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
httparse = "1.10.1"
inference = { path = "../inference", features = ["llama"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
serde.workspace = true
serde_json = "1.0.154"
sha2 = "=0.10.9"
storage = { path = "../storage" }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "io-util", "macros", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
url = "2.5.9"
zeroize = "1.9.2"

[dev-dependencies]
futures-executor = "0.3.34"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
