[package]
name = "local-first-ai-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
agent-core = { path = "../../../crates/agent-core" }
agent-tools = { path = "../../../crates/tools" }
