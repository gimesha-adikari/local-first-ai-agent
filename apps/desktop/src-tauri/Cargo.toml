inference = { path = "../../../crates/inference", features = ["llama"] }
rfd = { version = "=0.15.4", default-features = false, features = ["gtk3"] }
serde.workspace = true
serde_json = "1.0.154"
sha2 = "=0.10.9"
storage = { path = "../../../crates/storage" }
